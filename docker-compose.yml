# Local development database only. The app itself runs with `npm run dev`.
# Credentials here are for local development; production uses its own secrets.
services:
  postgres:
    image: postgres:17-alpine
    container_name: benuuprint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: benuuprint
      POSTGRES_PASSWORD: change-me-local-dev
      POSTGRES_DB: benuuprint
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - benuuprint-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benuuprint -d benuuprint"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  benuuprint-pgdata:
